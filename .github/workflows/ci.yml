name: CI

# Verification only: nothing here deploys, and no job holds production credentials.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every outbound base URL points at a reserved name that never resolves (RFC 6761), so no test
  # can reach a production service, even through a default (DIGIPEDIA_URL defaults to production).
  DIGIPEDIA_URL: https://digipedia.ci.invalid
  PORTAL_API_URL: https://portal.ci.invalid
  TRUSTID_API_URL: https://trustid.ci.invalid
  ELFCOM_URL: https://elfcom.ci.invalid
  SOVEREIGN_DRIVE_URL: https://drive.ci.invalid
  PLATFORM_JOBS_URL: https://jobs.ci.invalid
  MASTER_DISTRIBUTOR_URL: https://distributor.ci.invalid
  FUNDZMAN_URL: https://fundzman.ci.invalid
  LOGISTICS_OS_URL: https://logistics.ci.invalid
  PRIMITIVES_MODE: local
  LOGISTICS_MODE: local

jobs:
  sqlite:
    name: Build, typecheck, e2e (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      # The build generates the Prisma client; typecheck and tests need it.
      - name: Build
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: e2e (SQLite)
        run: npm run test:e2e

  postgres:
    name: e2e (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway CI container only. DATABASE_URL selects the PostgreSQL schema when the Prisma
      # client is generated; each e2e file then gets its own database on this server.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      ECO_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build (PostgreSQL Prisma client)
        run: npm run build
      - name: e2e (PostgreSQL)
        run: npm run test:e2e

  isolation:
    name: Environment isolation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # Static checks: Netlify previews, the web app, this workflow and the API config defaults
      # must not be able to send preview, CI or staging traffic to production.
      - name: Check environment isolation
        run: node scripts/ci/check-environment-isolation.mjs

  secret-scan:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # Official gitleaks release, verified against the published SHA-256 before it runs.
      - name: Install gitleaks 8.30.1
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      # Every commit of every fetched branch. Known test fixtures are listed by exact finding
      # fingerprint in .gitleaksignore, so a new secret in any file still fails the job.
      - name: Scan
        run: ./gitleaks git . --log-opts="--all" --redact --no-banner --exit-code 1
