[build]
  base = "apps/ecommerceos-web"
  command = "npm install && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback: /admin, /product/*, /cart must serve the app, not Netlify's 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Deploy Previews and branch deploys never talk to the production API. netlify.toml values
# override the site's UI variables of the same name; the reserved .invalid name never resolves.
# Point these at a staging API once one exists.
[context.deploy-preview.environment]
  VITE_API_URL = "https://ecommerceos-api.preview.invalid"

[context.branch-deploy.environment]
  VITE_API_URL = "https://ecommerceos-api.preview.invalid"
